services:
  diabetify-ml-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetify-ml-worker
    restart: unless-stopped
    environment:
      MODEL_DIR: /app
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:password123@rabbitmq:5672/}
      PYTHONUNBUFFERED: "1"
    command: ["python", "main_mq.py"]

  diabetify-ml-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetify-ml-api
    restart: unless-stopped
    environment:
      MODEL_DIR: /app
      PYTHONUNBUFFERED: "1"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "${ML_REST_PORT:-5000}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
