services:
  diabetify-ml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetify-ml
    restart: unless-stopped
    environment:
      # Local Docker runtime uses the model artifacts bundled in the image.
      MODEL_DIR: /app
      # Reuse RabbitMQ from diabetify-be (exposed on host port 5672).
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-password123}@host.docker.internal:5672/
      RELOAD_SECRET: ${RELOAD_SECRET:-diabetify-reload-dev-secret}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ML_REST_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
