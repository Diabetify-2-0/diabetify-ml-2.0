services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: diabetify-ml-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password123}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  diabetify-ml-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetify-ml-worker
    restart: unless-stopped
    environment:
      MODEL_DIR: /app
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-password123}@rabbitmq:5672/
      PYTHONUNBUFFERED: "1"
    command: ["python", "main_mq.py"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  diabetify-ml-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetify-ml-api
    restart: unless-stopped
    environment:
      MODEL_DIR: /app
      PYTHONUNBUFFERED: "1"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "${ML_REST_PORT:-5000}:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  rabbitmq_data:
