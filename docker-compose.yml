version: "3.8"

services:
  diabetify-ml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetify-ml
    restart: unless-stopped
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:password123@rabbitmq:5672/}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ML_REST_PORT:-5000}:5000"
      - "${ML_GRPC_PORT:-50051}:50051"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:5000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Optional: link to shared RabbitMQ if running in separate compose
    # networks:
    #   - diabetify-network
    # depends_on:
    #   - rabbitmq

# Uncomment to use shared network with BE
# networks:
#   diabetify-network:
#     driver: bridge
