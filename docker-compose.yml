services:
  diabetify-ml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diabetify-ml
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/models
      # RabbitMQ dari diabetify-be-2.0 (exposed di host port 5672)
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-password123}@host.docker.internal:5672/
      RELOAD_SECRET: ${RELOAD_SECRET:-}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${ML_REST_PORT:-5000}:5000"
    volumes:
      # Volume shared dengan diabetify-mlops untuk model yang sudah dipromote
      - diabetify_models_live:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  diabetify_models_live:
    external: true
